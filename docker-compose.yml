services:
  redis:
    image: redis/redis-stack-server:7.4.0-v3
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - path: config/.env
        required: false
      - path: .env
        required: false
    environment:
      PORT: "${PORT:-8000}"
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://host.docker.internal:11434
    depends_on:
      - redis
      - qdrant

volumes:
  qdrant_data:
