[project]
name = "voice-agent-server"
version = "0.1.0"
description = "Real-time voice agent server (FastAPI, Pipecat, Deepgram, Cartesia)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pipecat-ai[deepgram,cartesia,silero]==1.15.0",
  "pyyaml==6.0.2",
  "numpy==2.2.1",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
]
brain = [
  "fastembed==0.5.1",
  "redis==5.2.1",
  "qdrant-client==1.12.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
