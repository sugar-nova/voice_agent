[project]
name = "voice-agent-server"
version = "0.1.0"
description = "Phase 1 voice agent server (FastAPI + Pipecat)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pipecat-ai[deepgram,cartesia,silero]==1.15.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app"]
